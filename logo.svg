<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background -->
  <path d="M 100 20 L 160 50 L 160 100 C 160 140 100 170 100 170 C 100 170 40 140 40 100 L 40 50 Z" 
        fill="#E63946" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Inner shield -->
  <path d="M 100 30 L 155 55 L 155 100 C 155 135 100 160 100 160 C 100 160 45 135 45 100 L 45 55 Z" 
        fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Cross symbol (representing faith) -->
  <g transform="translate(100, 95)">
    <!-- Vertical line -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- Horizontal line -->
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="#1a1a1a">HOMENS FORTES</text>
</svg>
